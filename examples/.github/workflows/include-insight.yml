name: Include Insight

on:
  pull_request:

permissions:
  contents: read
  # Required by the `comment: true` input so reruns can update one report comment.
  pull-requests: write

jobs:
  include-insight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run include insight
        id: include-insight
        uses: Honahec/cpp-include-insight@v1
        with:
          build-command: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          compile-commands: build/compile_commands.json
          base: origin/main
          fail-on-new-cycle: true
          comment: true

      - name: Upload include insight report
        uses: actions/upload-artifact@v4
        with:
          name: cpp-include-insight-report
          path: ${{ steps.include-insight.outputs.report-path }}
